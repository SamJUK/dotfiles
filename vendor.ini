# Third-party code pinned to exact commits. install.sh fetches each into
# ~/.local/share/dotfiles/vendor/<name>; scripts/vendor-update.py proposes new pins.
#
# [name]
# url    = git repository
# commit = full 40-character commit to pin
# path   = folder inside the repo to fetch (default: whole repo)
# link   = where to link it, relative to ~ (default: fetch only, no link)
# track  = branch to follow, or latest-release (default: the repo's default branch)

[oh-my-zsh]
url    = https://github.com/ohmyzsh/ohmyzsh
commit = ff1df9a0399d56b9f6e957bb62a2d4ba6bc0ef4c

[powerlevel10k]
url    = https://github.com/romkatv/powerlevel10k
commit = 36f3045d69d1ba402db09d09eb12b42eebe0fa3b
link   = .config/zsh/custom/themes/powerlevel10k

[zsh-autosuggestions]
url    = https://github.com/zsh-users/zsh-autosuggestions
commit = 0e810e5afa27acbd074398eefbe28d13005dbc15
link   = .config/zsh/custom/plugins/zsh-autosuggestions

[zsh-syntax-highlighting]
url    = https://github.com/zsh-users/zsh-syntax-highlighting
commit = 5eb677bb0fa9a3e60f0eff031dc13926e093df92
link   = .config/zsh/custom/plugins/zsh-syntax-highlighting

[bkt]
url    = https://github.com/avivsinai/bitbucket-cli
commit = 226f53b93996009b089c8cd5ee6a14173b13eb5f
path   = skills/bkt
link   = .agents/skills/bkt
track  = latest-release
